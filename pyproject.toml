[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fiberguard"
version = "0.1.0"
description = "Reliable data loading for optical-network degradation telemetry"
requires-python = ">=3.10"
dependencies = [
  "scikit-learn>=1.4",
  "xgboost>=2.0",
  "matplotlib>=3.8",
  "mlflow>=3.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
test = ["httpx>=0.27"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
